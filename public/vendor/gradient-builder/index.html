<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gradient Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Fraunces:opsz,wght@9..144,100..900&family=Funnel+Display:wght@300..800&family=Gloock&family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,100..900&family=Italiana&family=Jost:wght@300..700&family=Limelight&family=Playfair+Display:wght@400..900&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="jg-root jg-root--studio" id="jg-root">
  <header class="jg-head">
    <a class="jg-brand" href="#studio">
      <span class="jg-brand-name">Gradient Builder</span>
      <span class="jg-brand-sub">gradient studies across shape, backdrop, and colour</span>
    </a>
    <div class="jg-head-right">
      <nav class="jg-modes" id="jg-modes" aria-label="Sections"></nav>
      <button type="button" class="jg-theme-switch" id="jg-theme" role="switch" aria-checked="false" aria-label="Thème sombre">
        <span class="jg-theme-knob" id="jg-theme-knob"></span>
      </button>
    </div>
  </header>

  <div class="jg-view jg-view--fade" id="jg-view">
    <section class="jg-studio" id="jg-studio">
      <div class="jg-canvas-col">
        <div class="jg-surface jg-canvas" id="jg-canvas-surface" role="button" title="Ouvrir en plein écran">
          <div class="jg-surface-fill"><canvas class="jg-wave-layers" id="jg-canvas" aria-hidden="true"></canvas></div>
          <div class="jg-surface-grain" id="jg-grain"></div>
          <div class="jg-image-layer" id="jg-image-layer"></div>
          <div class="jg-text-layer" id="jg-text-layer"></div>
          <div class="jg-canvas-tools">
            <button type="button" class="jg-tags-toggle" id="jg-tags" data-on="false"><span class="jg-swap"><span>Show tags</span></span></button>
          </div>
          <button type="button" class="jg-expand-btn" id="jg-expand" aria-label="Plein écran">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>

        <div class="jg-bands">
          <div class="jg-bands-track" id="jg-bands-track">
            <div class="jg-bands-fill" id="jg-bands-fill"></div>
            <div class="jg-bands-active" id="jg-bands-active"></div>
          </div>
          <span class="jg-bands-hint jg-dim" id="jg-bands-hint"></span>
        </div>

        <div class="jg-canvas-meta">
          <span class="jg-canvas-name"><strong class="jg-canvas-title" id="jg-title">Untitled blend</strong> <span class="jg-dim" id="jg-subtitle"></span></span>
          <span class="jg-canvas-meta-actions">
            <button type="button" class="jg-mini-btn jg-icon-only" id="jg-dice" title="Nouvelle combinaison" aria-label="Nouvelle combinaison">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
            </button>
            <button type="button" class="jg-mini-btn jg-icon-only" id="jg-shuffle" title="Mélanger les couleurs" aria-label="Mélanger les couleurs">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
            </button>
            <button type="button" class="jg-mini-btn" id="jg-save">Save</button>
            <button type="button" class="jg-mini-btn" id="jg-share">Share</button>
            <button type="button" class="jg-mini-btn" id="jg-preview">Preview</button>
            <button type="button" class="jg-primary-btn jg-primary-btn--sm" id="jg-export">Export</button>
          </span>
        </div>
      </div>

      <aside class="jg-panel" id="jg-panel"></aside>
    </section>

    <section class="jg-page" id="jg-page" hidden></section>
  </div>

  <div class="jg-sheet-scrim" id="jg-sheet-scrim" hidden>
    <section class="jg-sheet" id="jg-sheet" role="dialog" aria-modal="true" aria-label="Export">
      <div class="jg-group-head">
        <h4 id="jg-sheet-title">Export</h4>
        <button type="button" class="jg-mini-btn" id="jg-sheet-close">Fermer</button>
      </div>
      <div id="jg-sheet-body"></div>
    </section>
  </div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
