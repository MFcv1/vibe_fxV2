<!doctype html>
<html lang="fr" data-embed="vibefx">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Motion — VibeOS Studio</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Motion</span>
      <span class="brand-tag">Studio</span>
    </div>
    <div class="topbar-mid">
      <button type="button" class="icon-btn" id="undo" title="Annuler" aria-label="Annuler">↺</button>
      <button type="button" class="icon-btn" id="redo" title="Retablir" aria-label="Retablir">↻</button>
      <span class="doc-title" id="doc-title">Animation sans titre</span>
    </div>
    <div class="topbar-end">
      <span class="hint" id="status"></span>
      <button type="button" class="btn primary" id="export-open">Exporter</button>
    </div>
  </header>

  <div class="body">
    <aside class="rail" id="catalogue" aria-label="Catalogue d'animations"></aside>

    <section class="center">
      <div class="stage-wrap">
        <div class="stage-frame" id="stage-frame">
          <canvas id="stage" aria-label="Apercu de l'animation"></canvas>
        </div>
      </div>
      <div class="keys" id="keys">
        <button type="button" class="keys-toggle" id="keys-toggle" aria-expanded="false">
          <span id="keys-summary">Keyframes</span>
          <span class="keys-chevron" aria-hidden="true">⌃</span>
        </button>
        <div class="keys-body" id="keys-body" hidden>
          <div class="keys-ruler" id="keys-ruler"></div>
          <div class="keys-tracks" id="keys-tracks"></div>
        </div>
      </div>

      <div class="transport">
        <button type="button" class="icon-btn round" id="play" aria-label="Lecture / pause">❚❚</button>
        <button type="button" class="icon-btn round" id="rewind" aria-label="Revenir au debut">|◀</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position dans la boucle" />
        <span class="time" id="time">0.0s / 16.0s</span>
      </div>
    </section>

    <aside class="inspector" id="inspector" aria-label="Reglages"></aside>
  </div>
</div>

<div class="modal" id="export-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="export-title">
    <h2 id="export-title">Exporter l'animation</h2>
    <div class="field">
      <label for="export-res">Definition</label>
      <select id="export-res">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">2K</option>
        <option value="2160">4K</option>
        <option value="4320">8K</option>
      </select>
    </div>
    <div class="field">
      <label for="export-fps">Images par seconde</label>
      <select id="export-fps">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>
    </div>
    <div class="field">
      <label for="export-format">Format</label>
      <select id="export-format"></select>
    </div>
    <div class="field">
      <label for="export-loops">Boucles enchainees</label>
      <select id="export-loops">
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
      </select>
    </div>
    <p class="export-summary" id="export-summary"></p>
    <p class="export-warning" id="export-warning" hidden></p>
    <p class="modal-note" id="export-note"></p>
    <div class="progress" id="export-progress" hidden><div class="progress-bar" id="export-bar"></div></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="export-cancel">Annuler</button>
      <button type="button" class="btn primary" id="export-go">Exporter</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
